name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel, components and the wasm target.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets --no-default-features
      - run: cargo clippy --all-targets --all-features

      - run: cargo test --no-default-features
      - run: cargo test
      - run: cargo test --all-features

      # The core must stay I/O-free and wasm-buildable.
      - run: cargo build --target wasm32-unknown-unknown --no-default-features
      - run: cargo build --target wasm32-unknown-unknown

      # wasm32-unknown-unknown has a std implementation, so it would compile a
      # crate that had started linking std. This target has none.
      - run: cargo build --target thumbv7em-none-eabi --no-default-features

      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Match the feature set the deny.toml allowlist was built against.
          arguments: --all-features
